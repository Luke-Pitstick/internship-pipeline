services:
- type: web
  name: internship-pipeline-api
  runtime: docker
  repo: https://github.com/Luke-Pitstick/internship-pipeline
  branch: main
  region: oregon
  plan: standard
  dockerfilePath: ./Dockerfile
  dockerContext: .
  autoDeployTrigger: checksPass
  healthCheckPath: /healthz
  disk:
    name: internship-pipeline-data
    mountPath: /var/data
    sizeGB: 5
  envVars:
  - key: DASHBOARD_API_TOKEN
    sync: false
  - key: RESUME_GENERATION_PAUSED
    value: '1'
  - key: CODEX_HOME
    value: /var/data/codex
  - key: RESUME_MODEL
    value: gpt-6-luna
