[project]
name = "internship-pipeline"
version = "0.1.0"
description = "Fast internship discovery, grounded resume tailoring, and alerts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "httpx>=0.28,<1",
    "PyYAML>=6,<7",
    "apprise>=1,<2",
    "pypdf>=6,<7",
    "ats-scrapers==0.3.0",
    "python-jobspy==1.2.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pwdlib[argon2]>=0.3,<1",
    "cryptography>=46,<47",
    "python-docx>=1.2,<2",
]

[project.scripts]
internship-pipeline = "internship_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/internship_pipeline"]
