name: internship-pipeline

x-worker: &worker
  build:
    context: .
    target: pipeline
  image: internship-pipeline:local
  restart: unless-stopped
  init: true
  user: "${PIPELINE_UID:-10001}:${PIPELINE_GID:-10001}"
  read_only: true
  tmpfs:
    - /tmp
  env_file:
    - path: .env
      required: false
  environment:
    RESUME_MODEL: gpt-6-luna
    CODEX_HOME: /app/private/codex
  volumes:
    - ./config:/app/config:ro
    - ./private:/app/private:ro
    - ./data:/app/data
    - ./artifacts:/app/artifacts
  stop_grace_period: 45s

services:
  collector:
    <<: *worker
    command: [worker, collector]
  matcher:
    <<: *worker
    command: [worker, matcher]
  resumes:
    <<: *worker
    command: [worker, resumes]
  delivery:
    <<: *worker
    command: [worker, delivery]
  discovery:
    <<: *worker
    command: [worker, discovery]
