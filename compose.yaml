name: internship-pipeline
services:
  app:
    build: .
    image: internship-pipeline:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${PIPELINE_PORT:-8080}:8080"
    environment:
      PIPELINE_ORIGIN: ${PIPELINE_ORIGIN:-http://localhost:8080}
    volumes:
      - pipeline-data:/var/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/readyz', headers={'Host': __import__('urllib.parse', fromlist=['urlsplit']).urlsplit(__import__('os').environ['PIPELINE_ORIGIN']).netloc}), timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
    stop_grace_period: 45s
volumes:
  pipeline-data:
