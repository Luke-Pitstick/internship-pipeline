name: Downloaded release installation
on:
  workflow_dispatch:
    inputs:
      delivery:
        description: Explicit delivery being accepted; authenticated mode does not certify public access
        type: choice
        options: [staged-bundle, public-launcher]
        default: staged-bundle
        required: true
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        engine: [docker, podman]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated engine configuration
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/registry-config"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry-config/auth.json" >> "$GITHUB_ENV"
          if [ "$ENGINE" = podman ] && ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
      - name: Download hash-identical staging assets and authenticate image pull
        id: private
        if: inputs.delivery == 'staged-bundle'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          ENGINE: ${{ matrix.engine }}
        run: |
          set -eu
          gh run download 37999393250 --name curl-release-37999393250 --dir "$RUNNER_TEMP/staging"
          for asset in install.sh bootstrap_installer.py internship-pipeline-installer-v0.1.0-rc.3.tar.gz; do
            cp "$RUNNER_TEMP/staging/release/$asset" "$RUNNER_TEMP/release-assets/$asset"
          done
          printf '%s' "$GH_TOKEN" | "$ENGINE" login ghcr.io -u "$ACTOR" --password-stdin
      - name: Download public assets without credentials
        if: inputs.delivery == 'public-launcher'
        run: |
          set -eu
          for asset in install.sh bootstrap_installer.py internship-pipeline-installer-v0.1.0-rc.3.tar.gz; do
            curl --fail --location --proto '=https' --proto-redir '=https' \
              "https://github.com/Luke-Pitstick/internship-pipeline/releases/download/v0.1.0-rc.3/$asset" \
              --output "$RUNNER_TEMP/release-assets/$asset"
          done
      - name: Execute downloaded installer and exact-image recovery
        env:
          ENGINE: ${{ matrix.engine }}
          DELIVERY: ${{ inputs.delivery }}
        run: |
          python3 deploy/release-install-smoke.py --engine "$ENGINE" --delivery "$DELIVERY" \
            --assets "$RUNNER_TEMP/release-assets" --work "$RUNNER_TEMP/release-install" \
            --report "evidence/$ENGINE.json"
      - name: Retain bounded runtime failure evidence
        if: failure()
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          rows = []
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-install'
          for path in root.glob('*/installation.json'):
              manifest = json.loads(path.read_text())
              result = subprocess.run([os.environ['ENGINE'], 'inspect', manifest['container_name']],
                                      capture_output=True, text=True, timeout=15)
              if result.returncode:
                  rows.append({'installation': path.parent.name, 'inspect_exit': result.returncode})
                  continue
              container = json.loads(result.stdout)[0]
              state = container.get('State') or {}
              health = state.get('Health') or state.get('Healthcheck') or {}
              rows.append({'installation': path.parent.name, 'running': state.get('Running'),
                           'state_keys': sorted(state),
                           'native_health_status': (state.get('Health') or {}).get('Status'),
                           'legacy_healthcheck_status': (state.get('Healthcheck') or {}).get('Status'),
                           'exit_code': state.get('ExitCode'), 'health_status': health.get('Status'),
                           'health_state_keys': list(health),
                           'image_healthcheck_present': bool(container.get('Config', {}).get('Healthcheck'))})
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/failure.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(rows))
          PY
      - name: Remove runner-only registry credentials
        if: always() && steps.private.outcome == 'success'
        env:
          ENGINE: ${{ matrix.engine }}
        run: '"$ENGINE" logout ghcr.io'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-install-${{ matrix.runner }}-${{ matrix.engine }}-${{ inputs.delivery }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
