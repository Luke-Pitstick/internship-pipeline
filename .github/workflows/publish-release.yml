name: Publish verified curl release
on:
  workflow_run:
    workflows: [Container image candidates]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful container-images.yml run on this default-branch revision
        required: true
        type: string
      source_sha:
        description: Full accepted source SHA, equal to this workflow dispatch revision
        required: true
        type: string
      version:
        description: Stable release or numbered RC matching the package version (v1.0.0 or v1.0.0-rc.1)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: curl-release-publication
  cancel-in-progress: false
env:
  PIPELINE_RUN_ID: ${{ github.event.workflow_run.id || inputs.candidate_run_id }}
  PIPELINE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
  PIPELINE_VERSION: ${{ inputs.version }}
  PIPELINE_REPOSITORY: ${{ github.repository }}
  PIPELINE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  PIPELINE_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.PIPELINE_SOURCE_SHA }}
      - name: Validate candidate identity before downloading artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 - <<'PY'
          import os, re, tomllib
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['PIPELINE_RUN_ID']), 'Invalid run ID'
          assert os.environ['PIPELINE_SOURCE_SHA'] == os.environ['PIPELINE_WORKFLOW_SHA'], 'Dispatch the accepted source revision'
          if not os.environ['PIPELINE_VERSION']:
              package = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f"PIPELINE_VERSION=v{package}-rc.{os.environ['PIPELINE_RUN_ID']}\n")
          PY
          mkdir -p "$RUNNER_TEMP/publication"
          gh api "repos/$PIPELINE_REPOSITORY/actions/runs/$PIPELINE_RUN_ID" > "$RUNNER_TEMP/publication/run.json"
          gh api --paginate --slurp "repos/$PIPELINE_REPOSITORY/actions/runs/$PIPELINE_RUN_ID/artifacts" > "$RUNNER_TEMP/publication/artifacts.json"
          PYTHONPATH=deploy python3 - <<'PY'
          import json, os, pathlib, tomllib
          from publish_release import validate_run, validate_artifacts
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication'
          run = json.loads((root / 'run.json').read_text())
          validate_run(run, repository=os.environ['PIPELINE_REPOSITORY'], source_commit=os.environ['PIPELINE_SOURCE_SHA'],
                       default_branch=os.environ['PIPELINE_DEFAULT_BRANCH'])
          pages = json.loads((root / 'artifacts.json').read_text())
          package = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          validate_artifacts([item for page in pages for item in page['artifacts']], package_version=package,
                             source_commit=os.environ['PIPELINE_SOURCE_SHA'], run_id=int(os.environ['PIPELINE_RUN_ID']))
          PY
          gh run download "$PIPELINE_RUN_ID" --repo "$PIPELINE_REPOSITORY" --pattern 'image-*' --dir "$RUNNER_TEMP/publication/candidates"
      - name: Validate complete evidence and generated installer without writes
        run: |
          python3 deploy/publish_release.py \
            --source-dir "$GITHUB_WORKSPACE" --artifacts-dir "$RUNNER_TEMP/publication/candidates" \
            --run-json "$RUNNER_TEMP/publication/run.json" --artifacts-json "$RUNNER_TEMP/publication/artifacts.json" \
            --repository "$PIPELINE_REPOSITORY" --default-branch "$PIPELINE_DEFAULT_BRANCH" \
            --source-commit "$PIPELINE_SOURCE_SHA" \
            --version "$PIPELINE_VERSION" --output-dir "$RUNNER_TEMP/publication/release"
  promote:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.PIPELINE_SOURCE_SHA }}
      - name: Select the immutable release version
        run: |
          python3 - <<'PY'
          import os, tomllib
          if not os.environ['PIPELINE_VERSION']:
              package = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f"PIPELINE_VERSION=v{package}-rc.{os.environ['PIPELINE_RUN_ID']}\n")
          PY
      - name: Install OCI copy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Download the accepted run artifacts again for validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/publication"
          gh api "repos/$PIPELINE_REPOSITORY/actions/runs/$PIPELINE_RUN_ID" > "$RUNNER_TEMP/publication/run.json"
          gh api --paginate --slurp "repos/$PIPELINE_REPOSITORY/actions/runs/$PIPELINE_RUN_ID/artifacts" > "$RUNNER_TEMP/publication/artifacts.json"
          gh run download "$PIPELINE_RUN_ID" --repo "$PIPELINE_REPOSITORY" --pattern 'image-*' --dir "$RUNNER_TEMP/publication/candidates"
      - name: Authenticate GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          printf '%s' "$GH_TOKEN" | skopeo login --username "$PIPELINE_ACTOR" --password-stdin ghcr.io
          printf '%s' "$GH_TOKEN" | docker login --username "$PIPELINE_ACTOR" --password-stdin ghcr.io
      - name: Revalidate, preserve OCI bytes, and create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 deploy/publish_release.py --promote \
            --source-dir "$GITHUB_WORKSPACE" --artifacts-dir "$RUNNER_TEMP/publication/candidates" \
            --run-json "$RUNNER_TEMP/publication/run.json" --artifacts-json "$RUNNER_TEMP/publication/artifacts.json" \
            --repository "$PIPELINE_REPOSITORY" --default-branch "$PIPELINE_DEFAULT_BRANCH" \
            --source-commit "$PIPELINE_SOURCE_SHA" \
            --version "$PIPELINE_VERSION" --output-dir "$RUNNER_TEMP/publication/release"
      - name: Preserve publication evidence, including partial failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curl-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/publication/release*
            ${{ runner.temp }}/publication/run.json
            ${{ runner.temp }}/publication/artifacts.json
          if-no-files-found: warn
          retention-days: 7
      - name: Clear registry credentials
        if: always()
        run: |
          docker logout ghcr.io
          skopeo logout ghcr.io

  install:
    needs: promote
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        engine: [docker, podman]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.PIPELINE_SOURCE_SHA }}
      - name: Prepare the isolated runtime and download exact staged assets
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ matrix.engine }}
          PUBLICATION_RUN: ${{ github.run_id }}
        run: |
          set -eu
          if [ "$ENGINE" = podman ] && ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          gh run download "$PUBLICATION_RUN" --name "curl-release-$PUBLICATION_RUN" --dir "$RUNNER_TEMP/staging"
          VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/staging/release/release-metadata.json")
          python3 deploy/release-install-smoke.py --engine "$ENGINE" --delivery staged-bundle \
            --version "$VERSION" --source-commit "$PIPELINE_SOURCE_SHA" \
            --assets "$RUNNER_TEMP/staging/release" --work "$RUNNER_TEMP/release-install" \
            --report "evidence/$ENGINE.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: preview-install-${{ matrix.runner }}-${{ matrix.engine }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.PIPELINE_SOURCE_SHA }}
      - name: Publish the accepted release and verify anonymous curl resolution
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RUN: ${{ github.run_id }}
        run: |
          set -eu
          gh run download "$PUBLICATION_RUN" --name "curl-release-$PUBLICATION_RUN" --dir "$RUNNER_TEMP/staging"
          VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/staging/release/release-metadata.json")
          case "$VERSION" in
            *-rc.*) gh release edit "$VERSION" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$VERSION" --draft=false --prerelease=false --latest ;;
          esac
          for asset in install.sh release-metadata.json; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              "https://github.com/$PIPELINE_REPOSITORY/releases/download/$VERSION/$asset" \
              --output "$RUNNER_TEMP/$asset"
            cmp "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/staging/release/$asset"
          done
          # The anonymous releases API can briefly retain its pre-publication response.
          for attempt in {1..20}; do
            if sh install.sh --help > "$RUNNER_TEMP/current-installer.txt" && python3 - <<'CHECK'
          import os, pathlib
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'current-installer.txt').read_text()
          assert os.environ['PIPELINE_SOURCE_SHA'][:12] in text, 'Curl command resolved another container release'
          CHECK
            then
              cat "$RUNNER_TEMP/current-installer.txt"
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then sleep 5; fi
          done
          echo 'Anonymous curl resolution did not converge to the accepted source commit.' >&2
          exit 1
